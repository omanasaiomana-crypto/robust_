# Privilege Escalation Paths Library (Agent 8)
# Defined in PRD §13.4 as ordered step predicates with max gap hours between consecutive steps.
paths:
  - id: "PE-01"
    name: "Policy Version Manipulation"
    severity: 0.9
    mitre:
      - "T1098"
      - "T1078.004"
    max_gap_hours: 168
    steps:
      - step_num: 1
        actions:
          - "CreatePolicyVersion"
        stage: "privilege_escalation"
        conditions:
          set_as_default: true

  - id: "PE-02"
    name: "Admin Policy Attachment and Privilege Use"
    severity: 0.9
    mitre:
      - "T1098"
      - "T1078"
    max_gap_hours: 168
    steps:
      - step_num: 1
        actions:
          - "AttachUserPolicy"
          - "AttachRolePolicy"
          - "AttachGroupPolicy"
        stage: "privilege_escalation"
        conditions:
          policy_arn_contains:
            - "AdministratorAccess"
            - "admin"
            - "*"
      - step_num: 2
        stage: "privilege_escalation"
        conditions:
          is_privileged_or_write: true

  - id: "PE-03"
    name: "Inline Policy Wildcard and Privileged Call"
    severity: 0.85
    mitre:
      - "T1098"
    max_gap_hours: 168
    steps:
      - step_num: 1
        actions:
          - "PutUserPolicy"
          - "PutRolePolicy"
          - "PutGroupPolicy"
        stage: "privilege_escalation"
        conditions:
          wildcard_action: true
      - step_num: 2
        stage: "privilege_escalation"
        conditions:
          is_privileged_or_write: true

  - id: "PE-04"
    name: "Lambda PassRole and Function Invocation"
    severity: 0.85
    mitre:
      - "T1098"
      - "T1078"
    max_gap_hours: 168
    steps:
      - step_num: 1
        actions:
          - "PassRole"
        stage: "privilege_escalation"
      - step_num: 2
        actions:
          - "CreateFunction"
          - "CreateFunction20150331"
          - "UpdateFunctionCode"
          - "UpdateFunctionCode20150331"
        stage: "persistence"
      - step_num: 3
        actions:
          - "Invoke"
          - "InvokeFunction"
          - "InvokeAsync"
        stage: "privilege_escalation"

  - id: "PE-05"
    name: "Update AssumeRole Policy and Assume"
    severity: 0.9
    mitre:
      - "T1098"
      - "T1548"
    max_gap_hours: 168
    steps:
      - step_num: 1
        actions:
          - "UpdateAssumeRolePolicy"
        stage: "privilege_escalation"
      - step_num: 2
        actions:
          - "AssumeRole"
        stage: "privilege_escalation"

  - id: "PE-06"
    name: "Add User to Admin Group and Privileged Call"
    severity: 0.85
    mitre:
      - "T1098"
    max_gap_hours: 168
    steps:
      - step_num: 1
        actions:
          - "AddUserToGroup"
        stage: "privilege_escalation"
        conditions:
          group_name_contains:
            - "admin"
            - "root"
            - "wheel"
            - "secops"
      - step_num: 2
        stage: "privilege_escalation"
        conditions:
          is_privileged_or_write: true

  - id: "PE-07"
    name: "Credential Creation for Another User and Impersonation"
    severity: 0.85
    mitre:
      - "T1098.001"
      - "T1078.004"
    max_gap_hours: 168
    steps:
      - step_num: 1
        actions:
          - "CreateAccessKey"
          - "CreateLoginProfile"
        stage: "privilege_escalation"
        conditions:
          target_user_ne_caller: true
      - step_num: 2
        stage: "privilege_escalation"
        conditions:
          activity_as_target: true

  - id: "PE-08"
    name: "Discovery Burst to PrivEsc to Data Access Full Chain"
    severity: 1.0
    mitre:
      - "T1087"
      - "T1098"
      - "T1555"
      - "T1530"
    max_gap_hours: 168
    steps:
      - step_num: 1
        stage: "discovery"
        conditions:
          discovery_burst: true
      - step_num: 2
        stage: "privilege_escalation"
        conditions:
          any_privesc: true
      - step_num: 3
        stage: "collection"
        conditions:
          sensitive_data_or_secret: true
