<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IdentityShield · Geographic Login Globe</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Core Theme Styles -->
  <link rel="stylesheet" href="/v3/css/theme.css" />
  <link rel="stylesheet" href="/v3/css/motion.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Vendored 3D Globe Engine -->
  <script src="/vendor/three.min.js"></script>
  <script src="/vendor/globe.gl.min.js"></script>
</head>
<body>

  <div id="main-content" style="display:flex; flex-direction:column; height:calc(100vh - 100px); max-height:calc(100vh - 100px); gap:16px;">
    
    <!-- Top Filter Bar -->
    <div class="glass" style="padding:12px 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
      
      <div style="display:flex; align-items:center; gap:14px;">
        <div style="display:flex; align-items:center; gap:6px;">
          <span style="font-size:0.75rem; color:var(--muted);">Filter Identity:</span>
          <select id="select-globe-identity" style="padding:6px 12px; background:var(--surface); border:1px solid var(--panel-border); border-radius:var(--radius-control); color:var(--ink); font-size:0.8125rem; outline:none;">
            <option value="all">All Identities</option>
            <option value="svc-report">svc-report (Impossible Travel)</option>
            <option value="jdoe">jdoe (Engineering)</option>
            <option value="asmith">asmith (DevOps)</option>
          </select>
        </div>

        <span class="status-pill" style="font-size:0.6875rem; color:var(--crit);">
          <span class="status-dot crit"></span> 1 IMPOSSIBLE TRAVEL ARC
        </span>
      </div>

      <div style="display:flex; gap:10px;">
        <button id="btn-toggle-rotate" class="btn btn-ghost" type="button" style="padding:6px 12px; font-size:0.8125rem;">
          Toggle Auto-Rotate
        </button>
      </div>

    </div>

    <!-- 3D Globe + Side List Layout -->
    <div style="display:grid; grid-template-columns:1fr 360px; gap:16px; flex:1; min-height:0;">
      
      <!-- 3D Globe Container -->
      <div class="glass" style="position:relative; overflow:hidden; padding:0; display:flex; flex-direction:column;">
        <div style="position:absolute; top:14px; left:16px; z-index:10; pointer-events:none; background:rgba(5,7,13,0.7); backdrop-filter:blur(8px); padding:8px 12px; border-radius:8px; border:1px solid var(--panel-border);">
          <div style="font-size:0.6875rem; color:var(--muted); text-transform:uppercase; margin-bottom:4px; font-family:var(--font-mono);">Geographic Legend</div>
          <div style="display:flex; flex-direction:column; gap:4px; font-size:0.6875rem; font-family:var(--font-mono);">
            <span style="color:#EF4444;">● RED: Anomaly / Impossible Travel Origin</span>
            <span style="color:#10B981;">● GREEN: Known Corporate ASN / Office IP</span>
            <span style="color:#EF4444;">━ RED ARC: Impossible Velocity (> 900 km/h)</span>
          </div>
        </div>

        <div id="globe-container" style="flex:1; width:100%; height:100%; min-height:420px;"></div>
      </div>

      <!-- Side List: Impossible Travel & Ingress Events -->
      <div class="glass" style="padding:20px; display:flex; flex-direction:column; overflow-y:auto; gap:16px;">
        <div>
          <span style="font-size:0.6875rem; font-family:var(--font-mono); color:var(--crit);">DETECTION D-ACC-01</span>
          <h3 style="margin:2px 0 0 0; font-size:1rem; color:var(--ink);">Impossible Travel Events</h3>
        </div>

        <!-- Impossible Travel Events List -->
        <div id="globe-events-list" style="display:flex; flex-direction:column; gap:10px;">
          <!-- Dynamically populated -->
        </div>

        <!-- Ingress Logins List -->
        <div style="border-top:1px solid var(--panel-border); padding-top:14px;">
          <h4 style="font-size:0.75rem; color:var(--muted); text-transform:uppercase; margin:0 0 8px 0; font-family:var(--font-mono);">
            Active Locations & ASN Prefixes
          </h4>
          <div id="globe-locations-list" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>
      </div>

    </div>

  </div>

  <!-- Scripts -->
  <script type="module" src="/v3/js/core/shell.js"></script>
  <script type="module" src="/v3/js/fx/tilt.js"></script>
  <script type="module" src="/v3/js/pages/globe.js"></script>
</body>
</html>
