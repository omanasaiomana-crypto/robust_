<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IdentityShield · 15 Autonomous Agents</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Core Theme Styles -->
  <link rel="stylesheet" href="/v3/css/theme.css" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Vendored Chart.js 4.4.4 -->
  <script src="/vendor/chart.umd.min.js"></script>
</head>
<body>
  <!-- Fixed 3D Particle Network Canvas -->
  <canvas id="bg3d-canvas"></canvas>

  <div id="main-content">
    
    <!-- Page Header -->
    <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:16px;">
      <div>
        <div style="font-size:0.75rem; font-family:var(--font-mono); color:var(--cyan); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px;">
          Autonomous Architecture // Supervisor
        </div>
        <h1 style="font-size:1.75rem; font-weight:700; margin:0; color:#FFFFFF; letter-spacing:-0.02em;">
          15 Specialized Threat Agents
        </h1>
      </div>
      <div style="display:flex; gap:12px; align-items:center;">
        <span class="status-pill" style="color:#FFFFFF;">
          <span class="status-dot ok"></span>
          <span id="agents-health-pill">15/15 OPERATIONAL</span>
        </span>
        <a href="/v3/live.html" class="btn btn-primary" style="font-size:0.8125rem;">
          View 3D Live Constellation &rarr;
        </a>
      </div>
    </div>

    <!-- Agent Cards Container Grouped by 5 Functional Layers -->
    <div id="agents-layers-container" style="display:flex; flex-direction:column; gap:28px;">
      
      <!-- Skeletons while loading -->
      <div class="glass" style="padding:20px;">
        <div class="skeleton" style="height:28px; width:25%; margin-bottom:16px;"></div>
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px;">
          <div class="skeleton" style="height:160px;"></div>
          <div class="skeleton" style="height:160px;"></div>
          <div class="skeleton" style="height:160px;"></div>
        </div>
      </div>

    </div>

  </div>

  <!-- Agent Details & Recent Trace Slide-Out Drawer -->
  <div id="agent-drawer" style="position:fixed; top:0; right:-550px; width:520px; height:100vh; background:rgba(11, 15, 23, 0.96); backdrop-filter:blur(20px); border-left:1px solid var(--panel-border-bright); box-shadow:-10px 0 40px rgba(0,0,0,0.8); z-index:95; display:flex; flex-direction:column; transition:right 0.3s cubic-bezier(0.2, 0, 0.2, 1);">
    <div style="padding:18px 24px; border-bottom:1px solid var(--panel-border); display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div style="font-size:0.75rem; font-family:var(--font-mono); color:var(--cyan);">AGENT TELEMETRY DRAWER</div>
        <h3 id="drawer-agent-title" style="margin:2px 0 0 0; font-size:1.125rem; color:#FFFFFF; font-family:var(--font-mono);">a01 Collector</h3>
      </div>
      <button id="btn-close-agent-drawer" class="btn btn-ghost" type="button" style="padding:6px 10px;">
        ✕ Close
      </button>
    </div>
    
    <!-- Drawer Content -->
    <div style="flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px;">
      <div>
        <h4 style="font-size:0.8125rem; color:var(--muted); text-transform:uppercase; margin:0 0 6px 0;">Agent Capabilities</h4>
        <div id="drawer-capabilities" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
      </div>

      <div>
        <h4 style="font-size:0.8125rem; color:var(--muted); text-transform:uppercase; margin:0 0 8px 0;">Recent Trace Stream</h4>
        <div id="drawer-trace-list" style="display:flex; flex-direction:column; gap:6px; font-family:var(--font-mono); font-size:0.75rem;">
          <div style="color:var(--muted);">Listening for recent agent events...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="/v3/js/core/shell.js"></script>
  <script type="module" src="/v3/js/fx/bg3d.js"></script>
  <script type="module" src="/v3/js/fx/tilt.js"></script>
  <script type="module" src="/v3/js/pages/agents.js"></script>
</body>
</html>
